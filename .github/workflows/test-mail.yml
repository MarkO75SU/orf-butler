name: Test Mail

on:
  workflow_dispatch:

jobs:
  send-test:
    runs-on: ubuntu-latest
    steps:
      - name: Send test email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.web.de
          server_port: 587
          username: '${{ secrets.MAIL_USER }}'
          password: '${{ secrets.MAIL_PASS }}'
          subject: 'ORF-Butler SMTP Test'
          to: 'learncode@web.de'
          from: 'ORF-Butler Bot <${{ secrets.MAIL_USER }}>'
          body: 'Test-Email vom ORF-Butler Workflow. Wenn du das liest, funktionieren die SMTP-Zugangsdaten.'