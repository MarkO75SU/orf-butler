<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Openrouter Free Butler | Login</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body class="bg-[#0a0a0c] text-slate-300 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-[#111114] border border-slate-800 rounded-lg p-8 shadow-2xl relative">
        <div class="absolute top-0 left-0 w-full h-1 bg-sky-600"></div>
        
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-white tracking-tight uppercase">Openrouter Free Butler</h1>
            <p class="text-slate-500 text-xs uppercase tracking-[0.2em] mt-1">Login</p>
        </div>

        <form id="login-form" class="space-y-6">
            <div>
                <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Benutzername</label>
                <input type="text" id="username" name="username" required autocomplete="username"
                    class="w-full bg-[#1a1a1e] border border-slate-800 p-4 rounded text-xs outline-none focus:border-sky-600 transition text-center tracking-[0.2em] text-white font-mono uppercase"
                    placeholder="CODE EINGEBEN">
            </div>

            <button type="submit" class="w-full bg-sky-600 text-white text-xs font-bold py-4 rounded hover:bg-sky-500 transition uppercase tracking-[0.2em]">
                Einloggen
            </button>
            
            <p id="error-msg" class="text-red-500 text-[10px] text-center hidden"></p>
            <p id="success-msg" class="text-green-500 text-[10px] text-center hidden"></p>
        </form>

        <div class="mt-6 text-center">
            <a href="landing.html" class="text-[10px] text-slate-600 hover:text-slate-400 uppercase tracking-widest">← Zurück</a>
        </div>
    </div>

    <script type="module">
        import { isAuthenticated, login } from './src/js/auth.js';
        
        if (isAuthenticated()) {
            window.location.href = 'index.html';
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim().toUpperCase();
            const errorEl = document.getElementById('error-msg');
            const successEl = document.getElementById('success-msg');
            errorEl.classList.add('hidden');
            successEl.classList.add('hidden');

            if (!username) {
                errorEl.textContent = 'Bitte gib deinen Code ein.';
                errorEl.classList.remove('hidden');
                return;
            }

            const result = await login(username);
            
            if (result.success) {
                successEl.textContent = 'Login erfolgreich! Weiterleitung...';
                successEl.classList.remove('hidden');
                setTimeout(() => { window.location.href = 'index.html'; }, 500);
            } else {
                errorEl.textContent = result.error || 'Login fehlgeschlagen.';
                errorEl.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
