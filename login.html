<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Openrouter Free Butler | Login</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    </style>
</head>
<body class="bg-[#0a0a0c] text-slate-300 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-[#111114] border border-slate-800 rounded-lg p-8 shadow-2xl relative">
        <div class="absolute top-0 left-0 w-full h-1 bg-sky-600"></div>
        
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-white tracking-tight uppercase">Openrouter Free Butler</h1>
            <p class="text-slate-500 text-xs uppercase tracking-[0.2em] mt-1">Access Required</p>
        </div>

        <!-- Code Login (default) -->
        <form id="form-anon" class="space-y-6">
            <input type="text" name="username" value="anon" autocomplete="username" class="hidden" aria-hidden="true" tabindex="-1">
            
            <div class="relative">
                <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Nutzercode</label>
                <div class="relative">
                    <input type="password" id="anon-code" name="password" required maxlength="10" autocomplete="new-password"
                        class="w-full bg-[#1a1a1e] border border-slate-800 p-4 rounded text-xs outline-none focus:border-sky-600 transition text-center tracking-[0.3em] text-white font-mono uppercase pr-12"
                        placeholder="CODE EINGEBEN">
                    <button type="button" onclick="toggleAnonCode()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 text-xs">
                        👁
                    </button>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <input type="checkbox" id="anon-remember" class="w-4 h-4 accent-emerald-700" checked>
                <label for="anon-remember" class="text-[10px] text-slate-500 uppercase tracking-widest">Code speichern</label>
            </div>

            <button type="submit" class="w-full bg-emerald-700 text-white text-xs font-bold py-4 rounded hover:bg-emerald-600 transition uppercase tracking-[0.2em]">
                Anonym einloggen
            </button>
            
            <p id="anon-error-msg" class="text-red-500 text-[10px] text-center hidden"></p>
            <p id="anon-success-msg" class="text-green-500 text-[10px] text-center hidden"></p>
        </form>

        <!-- Admin toggle -->
        <div class="mt-4 text-center">
            <button onclick="toggleAdminForm()" id="admin-toggle-btn" class="text-[10px] text-slate-700 hover:text-slate-500 uppercase tracking-widest transition">Admin?</button>
        </div>

        <!-- Admin Login Form (hidden) -->
        <form id="form-admin" class="space-y-6 mt-4 hidden">
            <div class="border-t border-slate-800 pt-6">
                <div>
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Benutzername</label>
                    <input type="text" id="username" name="username" value="generali" required autocomplete="username"
                        class="w-full bg-[#1a1a1e] border border-slate-800 p-4 rounded text-[10px] outline-none focus:border-sky-600 transition uppercase tracking-[0.2em] text-white"
                        placeholder="USERNAME">
                </div>
                
                <div class="relative mt-4">
                    <label class="block text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">Passwort</label>
                    <div class="relative">
                        <input type="password" id="password" name="password" required autocomplete="current-password"
                            class="w-full bg-[#1a1a1e] border border-slate-800 p-4 rounded text-[10px] outline-none focus:border-sky-600 transition uppercase tracking-[0.2em] text-white pr-12"
                            placeholder="PASSWORD">
                        <button type="button" id="pw-toggle" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 text-xs">
                            👁
                        </button>
                    </div>
                </div>

                <div class="flex items-center gap-2 mt-4">
                    <input type="checkbox" id="remember" class="w-4 h-4 accent-sky-600" checked>
                    <label for="remember" class="text-[10px] text-slate-500 uppercase tracking-widest">Angemeldet bleiben</label>
                </div>

                <button type="submit" class="w-full bg-sky-600 text-white text-xs font-bold py-4 rounded hover:bg-sky-500 transition uppercase tracking-[0.2em] mt-4">
                    Admin Login
                </button>
                
                <p id="error-msg" class="text-red-500 text-[10px] text-center hidden mt-2">Zugang verweigert</p>
            </div>
        </form>

        <div class="mt-6 text-center">
            <a href="landing.html" class="text-[10px] text-slate-600 hover:text-slate-400 uppercase tracking-widest">← Zurück</a>
        </div>
    </div>

    <script>
        function togglePassword() {
            const pw = document.getElementById('password');
            const btn = document.getElementById('pw-toggle');
            if (pw.type === 'password') {
                pw.type = 'text';
                btn.textContent = '🙈';
            } else {
                pw.type = 'password';
                btn.textContent = '👁';
            }
        }

        function toggleAnonCode() {
            const el = document.getElementById('anon-code');
            const btns = document.querySelectorAll('#anon-code + button');
            const btn = btns[0];
            if (el.type === 'password') {
                el.type = 'text';
                btn.textContent = '🙈';
            } else {
                el.type = 'password';
                btn.textContent = '👁';
            }
        }

        function toggleAdminForm() {
            const form = document.getElementById('form-admin');
            const btn = document.getElementById('admin-toggle-btn');
            const isHidden = form.classList.contains('hidden');
            form.classList.toggle('hidden');
            btn.textContent = isHidden ? 'Admin ausblenden' : 'Admin?';
        }
    </script>

    <script type="module">
        import { checkAuth, login, loginWithCode, isAuthenticated } from './src/js/auth.js';
        
        if (isAuthenticated()) {
            window.location.href = 'index.html';
        }

        document.getElementById('form-admin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            
            const success = await login(user, pass, remember);
            
            if (success) {
                window.location.href = 'index.html';
            } else {
                document.getElementById('error-msg').classList.remove('hidden');
            }
        });

        document.getElementById('form-anon').addEventListener('submit', async (e) => {
            e.preventDefault();
            const code = document.getElementById('anon-code').value.trim().toUpperCase();
            const errorEl = document.getElementById('anon-error-msg');
            const successEl = document.getElementById('anon-success-msg');
            errorEl.classList.add('hidden');
            successEl.classList.add('hidden');

            if (!code) {
                errorEl.textContent = 'Bitte gib einen Code ein.';
                errorEl.classList.remove('hidden');
                return;
            }

            const result = await loginWithCode(code);
            
            if (result.success) {
                successEl.textContent = 'Login erfolgreich! Weiterleitung...';
                successEl.classList.remove('hidden');
                setTimeout(() => { window.location.href = 'index.html'; }, 500);
            } else {
                errorEl.textContent = result.error || 'Ungültiger oder aufgebrauchter Code.';
                errorEl.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
